<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barcode SKU Warehouse</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#111;--ink2:#444;--muted:#888;--line:#e0e0e0;--bg:#f5f5f5;
  --green:#0d5c3a;--green-l:#e6f4ee;--line2:#c8d4d0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font-family:inherit}

/* topbar */
.topbar{background:#111;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;font-weight:700}
.topbar .info{font-size:12px;color:rgba(255,255,255,.5)}
.tbacts{display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{padding:7px 14px;border:none;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;transition:opacity .13s}
.tb-btn:hover{opacity:.85}
.btn-wh{background:#fff;color:#111}
.btn-gr{background:#0d5c3a;color:#fff}

/* filter */
.filterbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filterbar input{padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;font-size:13.5px;width:260px;outline:none}
.filterbar input:focus{border-color:#0d5c3a}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap}
.cat-tab{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink2);transition:all .12s}
.cat-tab.on{color:#fff;border-color:transparent}
.ct-all.on{background:#111}.ct-0.on{background:#0d5c3a}.ct-1.on{background:#1a6b5a}
.ct-2.on{background:#1a3d72}.ct-3.on{background:#7a4800}.ct-4.on{background:#4a1d72}
.sel-count{font-size:12px;color:var(--muted);margin-left:4px;white-space:nowrap}

/* main */
.main{padding:18px 20px;max-width:1400px;margin:0 auto}
.kat-section{margin-bottom:28px}
.kat-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.kat-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
.kat-count{font-size:12px;color:var(--muted);font-weight:500}
.sku-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

/* SKU card */
.sku-card{background:#fff;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;transition:box-shadow .13s,border-color .13s;cursor:pointer;position:relative}
.sku-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:#bbb}
.sku-card.selected{border-color:#0d5c3a;box-shadow:0 0 0 2.5px rgba(13,92,58,.18)}
.sku-card .chk{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:12px;transition:all .13s}
.sku-card.selected .chk{background:#0d5c3a;border-color:#0d5c3a;color:#fff}
.card-info{padding:10px 12px 8px}
.card-nama{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;margin-bottom:3px}
.card-sku{font-family:'Courier New',monospace;font-size:10.5px;color:var(--muted);word-break:break-all}
/* QR display di kartu */
.card-qr-wrap{padding:10px;border-top:1px solid var(--line);background:#fafafa;display:flex;flex-direction:column;align-items:center;gap:6px}
.card-qr-wrap .qr-lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card-qr-wrap canvas,.card-qr-wrap img{border-radius:4px;display:block}
.card-bar-wrap{padding:6px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card-bar-wrap .bar-lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card-bar-wrap svg{max-width:100%;height:auto}
.card-acts{display:flex;border-top:1px solid var(--line)}
.card-act{flex:1;padding:8px 4px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--ink2);transition:background .1s;display:flex;align-items:center;justify-content:center;gap:4px}
.card-act:first-child{border-right:1px solid var(--line)}
.card-act:hover{background:var(--bg)}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* print panel */
.print-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #0d5c3a;padding:12px 20px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,.12);flex-wrap:wrap}
.print-panel.show{display:flex}
.pp-info{font-size:14px;font-weight:600}
.pp-info span{color:#0d5c3a}
.pp-acts{display:flex;gap:8px}

/* toast */
.toast{position:fixed;bottom:70px;right:20px;background:#111;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transform:translateY(10px);transition:all .2s;z-index:999;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}

/* print sheet hidden */
.print-sheet{display:none}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:17px;font-weight:700;margin-bottom:4px;color:#111}
.modal-box p{font-size:13px;color:#666;margin-bottom:20px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#555;margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 11px;border:1.5px solid #ddd;border-radius:7px;font-size:15px;font-weight:600;text-align:center;outline:none}
.field select{font-size:13px;text-align:left}
.tips-box{background:#f5f5f5;border-radius:8px;padding:12px;margin-bottom:18px;font-size:12px;color:#555;line-height:1.5}
.modal-acts{display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{padding:10px 20px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;font-weight:600;background:#fff;cursor:pointer;color:#444}
.btn-print{padding:10px 22px;border:none;border-radius:8px;font-size:14px;font-weight:600;background:#0d5c3a;color:#fff;cursor:pointer}

@media print{
  /* dikontrol JS */
}

/* modal tambah SKU */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:16px;color:#111}
.mf{margin-bottom:14px}
.mf label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#555;margin-bottom:5px}
.mf input,.mf select{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;outline:none;transition:border-color .15s}
.mf input:focus,.mf select:focus{border-color:#0d5c3a}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.m-cancel{padding:10px 18px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;font-weight:600;background:#fff;cursor:pointer;color:#444}
.m-save{padding:10px 22px;border:none;border-radius:8px;font-size:14px;font-weight:600;background:#0d5c3a;color:#fff;cursor:pointer}
.m-save:hover{background:#0a4a2f}
.new-badge{display:inline-block;font-size:9px;font-weight:700;background:#0d5c3a;color:#fff;padding:2px 6px;border-radius:99px;vertical-align:middle;margin-left:5px;letter-spacing:.04em}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Barcode SKU Warehouse</h1>
    <div class="info" id="totalInfo">Memuat data...</div>
  </div>
  <div class="tbacts">
    <button class="tb-btn btn-wh" onclick="selectAll()">Pilih semua terfilter</button>
    <button class="tb-btn btn-wh" onclick="clearSel()">Hapus pilihan</button>
    <button class="tb-btn btn-gr" onclick="printSelected()">🖨 Print label terpilih</button>
    <button class="tb-btn" style="background:#1a6b5a;color:#fff" onclick="openAddSKU()">+ Tambah SKU Baru</button>
  </div>
</div>

<div class="filterbar">
  <input id="searchBox" placeholder="Cari nama produk atau SKU..." oninput="applyFilter()">
  <div class="cat-tabs" id="catTabs"></div>
  <span class="sel-count" id="selCount"></span>
</div>

<div class="main" id="mainContent"></div>

<div class="print-panel" id="printPanel">
  <div class="pp-info"><span id="ppCount">0</span> label dipilih — siap print QR</div>
  <div class="pp-acts">
    <button class="tb-btn btn-wh" onclick="clearSel()" style="border:1.5px solid #ddd">Batal</button>
    <button class="tb-btn btn-gr" onclick="printSelected()">🖨 Print QR label</button>
  </div>
</div>

<!-- Modal pengaturan label -->
<div class="modal-overlay" id="printModal">
  <div class="modal-box">
    <h3>Pengaturan Label QR</h3>
    <p id="pmDesc">0 label akan dicetak</p>
    <div class="field-grid">
      <div class="field">
        <label>Lebar label (mm)</label>
        <input type="number" id="lblW" value="40" min="20" max="120">
      </div>
      <div class="field">
        <label>Tinggi label (mm)</label>
        <input type="number" id="lblH" value="40" min="20" max="120">
      </div>
      <div class="field">
        <label>Copy tiap label</label>
        <input type="number" id="lblQty" value="1" min="1" max="50">
      </div>
      <div class="field">
        <label>Preset ukuran</label>
        <select id="lblPreset" onchange="applyPreset()">
          <option value="">-- Pilih preset --</option>
          <option value="40,40">40×40mm</option>
          <option value="50,50">50×50mm</option>
          <option value="30,30">30×30mm (mini)</option>
          <option value="60,60">60×60mm</option>
          <option value="80,80">80×80mm</option>
          <option value="58,40">58×40mm (thermal 58mm)</option>
          <option value="100,100">100×100mm</option>
        </select>
      </div>
    </div>
    <div class="tips-box">
      <strong>Tips printer thermal:</strong> Set ukuran kertas di driver printer = ukuran label di atas.
      Di dialog print Chrome pilih <em>Scale: 100%</em>, matikan <em>Headers &amp; footers</em>.
    </div>
    <div class="modal-acts">
      <button class="btn-cancel" onclick="closePrintModal()">Batal</button>
      <button class="btn-print" onclick="executePrint()">🖨 Print sekarang</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="print-sheet" id="printSheet"></div>


<!-- Modal Tambah SKU Baru -->
<div class="modal-bg" id="addSkuModal">
  <div class="modal-box">
    <h3>Tambah SKU Baru <span class="new-badge">NEW</span></h3>
    <div class="mf">
      <label>Nama Produk</label>
      <input id="newSkuNama" placeholder="contoh: Aglo Nutrients 250ml" oninput="autoFillSkuCode()">
    </div>
    <div class="mf">
      <label>Kode SKU</label>
      <input id="newSkuKode" placeholder="contoh: AgloNutrients_250ml">
    </div>
    <div class="mf-row">
      <div class="mf">
        <label>Kategori</label>
        <select id="newSkuKat">
          <option value="Perawatan Tanaman">Perawatan Tanaman</option>
          <option value="Media Satuan">Media Satuan</option>
          <option value="Media Mix">Media Mix</option>
          <option value="Peralatan Berkebun">Peralatan Berkebun</option>
          <option value="Pot & Dekorasi">Pot &amp; Dekorasi</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <div class="mf">
        <label>Satuan</label>
        <input id="newSkuUnit" placeholder="pcs / botol / pack" value="pcs">
      </div>
    </div>
    <div class="modal-acts">
      <button class="m-cancel" onclick="closeAddSKU()">Batal</button>
      <button class="m-save" onclick="confirmAddSKU()">Simpan &amp; Generate Barcode</button>
    </div>
  </div>
</div>

const CATS = [...new Set(SKU_DATA.map(s=>s.kategori))];
const CAT_COLORS = {"Perawatan Tanaman": "#0d5c3a", "Media Satuan": "#1a6b5a", "Media Mix": "#1a3d72", "Peralatan Berkebun": "#7a4800", "Pot & Dekorasi": "#4a1d72"};
let selected = new Set();
let currentCat = 'all';
let currentSearch = '';

/* utils */
function safeId(s){ return String(s).replace(/[^a-zA-Z0-9]/g,'_'); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast';
  void el.offsetWidth; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('on'),3000);
}

/* filter & tabs */
function init(){
  loadCustomSKU(); buildCatTabs(); applyFilter(); updateInfo();
}
function buildCatTabs(){
  const el=document.getElementById('catTabs');
  const all=document.createElement('button');
  all.className='cat-tab ct-all on'; all.textContent='Semua';
  all.onclick=()=>setCat('all'); el.appendChild(all);
  CATS.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='cat-tab ct-'+i;
    btn.textContent=c+' ('+SKU_DATA.filter(s=>s.kategori===c).length+')';
    btn.onclick=()=>setCat(c); el.appendChild(btn);
  });
}
function setCat(c){
  currentCat=c;
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('on'));
  const btn = c==='all'
    ? document.querySelector('.ct-all')
    : document.querySelectorAll('.cat-tab')[CATS.indexOf(c)+1];
  if(btn) btn.classList.add('on');
  applyFilter();
}
function applyFilter(){
  const q=document.getElementById('searchBox').value.toLowerCase().trim();
  currentSearch=q;
  const list=SKU_DATA.filter(s=>{
    const mc=currentCat==='all'||s.kategori===currentCat;
    const mq=!q||s.nama.toLowerCase().includes(q)||s.sku.toLowerCase().includes(q);
    return mc&&mq;
  });
  renderCards(list);
}

function renderCards(list){
  const main=document.getElementById('mainContent');
  if(!list.length){main.innerHTML='<div class="empty">Tidak ada SKU yang cocok.</div>';updateInfo();return;}
  const byKat={};
  list.forEach(s=>{if(!byKat[s.kategori])byKat[s.kategori]=[];byKat[s.kategori].push(s);});
  main.innerHTML=Object.entries(byKat).map(([kat,skus],ki)=>{
    const color=CAT_COLORS[kat]||'#333';
    const cards=skus.map(s=>`
      <div class="sku-card ${selected.has(s.sku)?'selected':''}" id="card_${safeId(s.sku)}" onclick="toggleSelect('${esc(s.sku)}')">
        <div class="chk">${selected.has(s.sku)?'✓':''}</div>
        <div class="card-info">
          <div class="card-nama">${esc(s.nama)}${s._custom?'<span class="new-badge">NEW</span>':''}</div>
          <div class="card-sku">${esc(s.sku)}</div>
        </div>
        <div class="card-qr-wrap" id="qr_${safeId(s.sku)}">
          <div class="qr-lbl">QR Code</div>
        </div>
        <div class="card-bar-wrap" id="bar_${safeId(s.sku)}">
          <div class="bar-lbl">Barcode</div>
        </div>
        <div class="card-acts">
          <button class="card-act" onclick="event.stopPropagation();printOne('${esc(s.sku)}','${esc(s.nama)}')">🖨 Print QR</button>
          <button class="card-act" onclick="event.stopPropagation();toggleSelect('${esc(s.sku)}')">
            ${selected.has(s.sku)?'✓ Dipilih':'+ Pilih'}
          </button>
        </div>
      </div>`).join('');
    return `<div class="kat-section">
      <div class="kat-head">
        <span class="kat-badge" style="background:${color}">${kat}</span>
        <span class="kat-count">${skus.length} SKU</span>
      </div>
      <div class="sku-grid">${cards}</div>
    </div>`;
  }).join('');
  requestAnimationFrame(()=>{
    list.forEach(s=>{ try{genQR(s.sku);genBar(s.sku);}catch(e){} });
    updateInfo();
  });
}

function genQR(sku){
  const el=document.getElementById('qr_'+safeId(sku)); if(!el) return;
  const old=el.querySelector('canvas, img'); if(old) return; // sudah ada
  const div=document.createElement('div'); el.appendChild(div);
  new QRCode(div,{text:sku,width:100,height:100,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
}
function genBar(sku){
  const el=document.getElementById('bar_'+safeId(sku)); if(!el) return;
  const old=el.querySelector('svg'); if(old) return;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); el.appendChild(svg);
  JsBarcode(svg,sku,{format:'CODE128',width:1.4,height:32,displayValue:false,margin:3,background:'transparent',lineColor:'#000'});
}

/* selection */
function toggleSelect(sku){
  if(selected.has(sku)) selected.delete(sku); else selected.add(sku);
  const card=document.getElementById('card_'+safeId(sku));
  if(card){
    card.classList.toggle('selected',selected.has(sku));
    card.querySelector('.chk').textContent=selected.has(sku)?'✓':'';
    card.querySelector('.card-acts button:last-child').textContent=selected.has(sku)?'✓ Dipilih':'+ Pilih';
  }
  updatePanel();
}
function selectAll(){
  const list=SKU_DATA.filter(s=>{
    const mc=currentCat==='all'||s.kategori===currentCat;
    const mq=!currentSearch||s.nama.toLowerCase().includes(currentSearch)||s.sku.toLowerCase().includes(currentSearch);
    return mc&&mq;
  });
  list.forEach(s=>selected.add(s.sku)); applyFilter(); showToast(list.length+' SKU dipilih');
}
function clearSel(){selected.clear();applyFilter();updatePanel();}
function updatePanel(){
  const n=selected.size;
  document.getElementById('ppCount').textContent=n;
  document.getElementById('printPanel').classList.toggle('show',n>0);
  document.getElementById('selCount').textContent=n>0?n+' dipilih':'';
}
function updateInfo(){
  document.getElementById('totalInfo').textContent=SKU_DATA.length+' SKU · '+CATS.length+' kategori';
  updatePanel();
}

/* modal */
function applyPreset(){
  const v=document.getElementById('lblPreset').value; if(!v) return;
  const [w,h]=v.split(',').map(Number);
  document.getElementById('lblW').value=w;
  document.getElementById('lblH').value=h;
}
function openPrintModal(items){
  window._printItems=items;
  document.getElementById('pmDesc').textContent=items.length+' label QR siap dicetak — atur ukuran sesuai printer thermal kamu';
  document.getElementById('printModal').classList.add('open');
}
function closePrintModal(){
  document.getElementById('printModal').classList.remove('open');
}
function printOne(sku,nama){openPrintModal([{sku,nama}]);}
function printSelected(){
  if(!selected.size){showToast('Pilih minimal 1 label dulu');return;}
  openPrintModal(SKU_DATA.filter(s=>selected.has(s.sku)));
}
function executePrint(){
  const LW=parseFloat(document.getElementById('lblW').value)||40;
  const LH=parseFloat(document.getElementById('lblH').value)||40;
  const QTY=parseInt(document.getElementById('lblQty').value)||1;
  const base=window._printItems||[];
  const items=[];
  for(let q=0;q<QTY;q++) base.forEach(s=>items.push(s));
  closePrintModal();
  buildPrintSheet(items,LW,LH);
}

/* PRINT — QR Code only + nama SKU */
function buildPrintSheet(items,LW,LH){
  LW=LW||40; LH=LH||40;

  /* CSS @page dinamis */
  let st=document.getElementById('dynPrint'); if(st) st.remove();
  st=document.createElement('style'); st.id='dynPrint';
  const QMM=Math.min(LW,LH)*0.68;
  const SPT=Math.max(Math.round(Math.min(LW,LH)*0.12),5);
  st.textContent=[
    '@media print{',
    '  @page{size:'+LW+'mm '+LH+'mm;margin:0}',
    '  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;box-sizing:border-box}',
    '  body>*{display:none!important}',
    '  .print-sheet{display:block!important;margin:0;padding:0;background:#fff}',
    '  #psWrap{margin:0;padding:0}',
    '  .psl{',
    '    page-break-after:always;break-after:page;',
    '    width:'+LW+'mm;height:'+LH+'mm;',
    '    display:flex;flex-direction:column;',
    '    align-items:center;justify-content:center;',
    '    background:#fff;gap:1.8mm;padding:2mm',
    '  }',
    '  .psl-qr{width:'+QMM+'mm;height:'+QMM+'mm;display:block;image-rendering:pixelated}',
    '  .psl-name{',
    '    font-family:Arial,sans-serif;font-size:'+SPT+'pt;font-weight:700;',
    '    text-align:center;color:#000;line-height:1.2;',
    '    word-break:break-all;max-width:'+(LW-3)+'mm',
    '  }',
    '}'
  ].join('\n');
  document.head.appendChild(st);

  /* render QR -> canvas -> PNG per SKU unik @ 300dpi */
  const PX=11.811;
  const qpx=Math.round(QMM*PX);
  const qimgs={};

  const uniqueSkus=[...new Set(items.map(s=>s.sku))];
  let done=0;

  function afterAll(){
    /* build print DOM */
    const sheet=document.getElementById('printSheet');
    const wrap=document.createElement('div'); wrap.id='psWrap';
    items.forEach(s=>{
      const div=document.createElement('div'); div.className='psl';
      const src=qimgs[s.sku];
      div.innerHTML=(src
        ?'<img class="psl-qr" src="'+src+'" alt="'+esc(s.sku)+'">'
        :'<div style="font-size:7pt;color:red">QR Error</div>')
        +'<div class="psl-name">'+esc(s.sku)+'</div>';
      wrap.appendChild(div);
    });
    sheet.innerHTML=''; sheet.appendChild(wrap);
    setTimeout(()=>window.print(),500);
  }

  uniqueSkus.forEach(sku=>{
    const tmp=document.createElement('div');
    tmp.style.cssText='position:absolute;left:-9999px;top:-9999px';
    document.body.appendChild(tmp);
    try{
      new QRCode(tmp,{text:sku,width:qpx,height:qpx,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      /* QRCode.js render synchronous ke canvas */
      const qc=tmp.querySelector('canvas');
      if(qc){
        qimgs[sku]=qc.toDataURL('image/png',1.0);
        document.body.removeChild(tmp);
        done++;
        if(done===uniqueSkus.length) afterAll();
      } else {
        /* fallback: tunggu img load */
        const qi=tmp.querySelector('img');
        if(qi){
          const finalize=()=>{
            const cv=document.createElement('canvas'); cv.width=qpx; cv.height=qpx;
            const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,qpx,qpx);
            ctx.drawImage(qi,0,0,qpx,qpx);
            qimgs[sku]=cv.toDataURL('image/png',1.0);
            document.body.removeChild(tmp);
            done++;
            if(done===uniqueSkus.length) afterAll();
          };
          if(qi.complete) finalize(); else qi.onload=finalize;
        } else {
          qimgs[sku]=null; document.body.removeChild(tmp); done++;
          if(done===uniqueSkus.length) afterAll();
        }
      }
    }catch(e){
      qimgs[sku]=null;
      try{document.body.removeChild(tmp);}catch(_){}
      done++;
      if(done===uniqueSkus.length) afterAll();
    }
  });

  if(uniqueSkus.length===0) afterAll();
}

/* ── Tambah SKU Baru ── */
function openAddSKU(){
  document.getElementById('newSkuNama').value='';
  document.getElementById('newSkuKode').value='';
  document.getElementById('newSkuUnit').value='pcs';
  document.getElementById('addSkuModal').classList.add('open');
  setTimeout(function(){ document.getElementById('newSkuNama').focus(); }, 100);
}
function closeAddSKU(){
  document.getElementById('addSkuModal').classList.remove('open');
}

function autoFillSkuCode(){
  var nama = document.getElementById('newSkuNama').value.trim();
  // Auto-generate kode SKU dari nama: TitleCase, hapus spasi
  var kode = nama
    .split(/\s+/)
    .map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1); })
    .join('')
    .replace(/[^a-zA-Z0-9_.]/g,'_')
    .replace(/_+/g,'_')
    .replace(/^_|_$/g,'');
  document.getElementById('newSkuKode').value = kode;
}

function confirmAddSKU(){
  var nama = document.getElementById('newSkuNama').value.trim();
  var kode = document.getElementById('newSkuKode').value.trim();
  var kat  = document.getElementById('newSkuKat').value;
  var unit = document.getElementById('newSkuUnit').value.trim() || 'pcs';

  if(!nama){ alert('Nama produk tidak boleh kosong.'); return; }
  if(!kode){ alert('Kode SKU tidak boleh kosong.'); return; }

  // Cek duplikat
  for(var i=0;i<SKU_DATA.length;i++){
    if(SKU_DATA[i].sku.toLowerCase()===kode.toLowerCase()){
      alert('Kode SKU "'+kode+'" sudah ada!'); return;
    }
  }

  // Tambah ke SKU_DATA
  var newEntry = {kategori: kat, nama: nama, sku: kode, unit: unit};
  SKU_DATA.push(newEntry);

  // Simpan ke localStorage agar persistent
  try{ localStorage.setItem('barcodeExtraSKU', JSON.stringify(
    SKU_DATA.filter(function(s){ return s._custom; })
  )); }catch(e){}
  newEntry._custom = true;

  // Tutup modal, reset filter, render ulang
  closeAddSKU();
  currentCat = 'all';
  currentSearch = '';
  document.getElementById('searchBox').value = '';

  // Rebuild cat tabs karena mungkin ada kategori baru
  document.getElementById('catTabs').innerHTML = '';
  buildCatTabs();

  applyFilter();
  updateInfo();
  showToast('"'+nama+'" ditambahkan — barcode siap di-print!');

  // Scroll ke SKU baru
  setTimeout(function(){
    var id = 'card_'+safeId(kode);
    var el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 400);
}

/* Load custom SKU dari localStorage saat init */
function loadCustomSKU(){
  try{
    var saved = localStorage.getItem('barcodeExtraSKU');
    if(saved){
      var extras = JSON.parse(saved);
      extras.forEach(function(s){
        var exists = false;
        for(var i=0;i<SKU_DATA.length;i++){
          if(SKU_DATA[i].sku===s.sku){exists=true;break;}
        }
        if(!exists){ s._custom=true; SKU_DATA.push(s); }
      });
    }
  }catch(e){}
}


init();
</script>
