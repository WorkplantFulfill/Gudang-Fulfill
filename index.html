<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stok Display Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f2;min-height:100vh}
input,select,button,textarea{font-family:inherit;font-size:16px}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.10)}
.login-logo{width:56px;height:56px;background:#0d5c3a;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.login-logo svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2}
.login-box h1{font-size:22px;font-weight:700;color:#111;margin-bottom:4px}
.login-box p{font-size:14px;color:#666;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;outline:none;transition:border-color .15s}
.field input:focus{border-color:#0d5c3a}
.err{color:#c0392b;font-size:13px;margin-bottom:12px;display:none}
.btn-login{width:100%;padding:14px;background:#0d5c3a;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-login:active{background:#0a4a2f}

/* App */
.app{display:none;flex-direction:column;min-height:100vh}
.topbar{background:#0d1a12;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:8px}
.topbar-left h1{font-size:15px;font-weight:700}
.topbar-left .sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-btn{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.btn-white{background:#fff;color:#111}
.btn-green{background:#0d5c3a;color:#fff}
.btn-red{background:#8b1a1a;color:#fff}

/* Tabs */
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #e0e0e0;padding:0 4px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-size:13px;font-weight:600;color:#666;border-bottom:2.5px solid transparent;white-space:nowrap;cursor:pointer;flex-shrink:0}
.tab.on{color:#0d5c3a;border-bottom-color:#0d5c3a}

/* Content */
.content{padding:16px;flex:1;max-width:900px;margin:0 auto;width:100%}

/* Card */
.card{background:#fff;border-radius:12px;margin-bottom:16px;overflow:hidden;border:1px solid #e8e8e8}
.card-head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;gap:8px}
.card-head h2{font-size:15px;font-weight:700;color:#111}
.card-body{padding:16px 18px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#888;border-bottom:1px solid #f0f0f0;background:#fafafa}
.tbl td{padding:10px 12px;border-bottom:1px solid #f7f7f7;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}

/* Badge */
.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge-ok{background:#e6f4ee;color:#0d5c3a}
.badge-warn{background:#fff3e0;color:#7a4800}
.badge-low{background:#fdecea;color:#8b1a1a}
.badge-role{color:#fff;padding:3px 10px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:14px;border:1px solid #e8e8e8;text-align:center}
.stat .n{font-size:24px;font-weight:700;color:#111}
.stat .k{font-size:11px;color:#888;margin-top:2px}
.stat.warn .n{color:#c0392b}

/* Banner */
.banner{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.banner-ok{background:#e6f4ee;color:#0d5c3a}
.banner-warn{background:#fff3e0;color:#7a4800}

/* Cat tabs */
.cat-bar{display:flex;gap:7px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #f0f0f0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cat-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #ddd;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
.cat-btn.on{background:#0d5c3a;color:#fff;border-color:#0d5c3a}

/* Buttons */
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:opacity .1s}
.btn:active{opacity:.8}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-g{background:#0d5c3a;color:#fff}
.btn-r{background:#8b1a1a;color:#fff}
.btn-a{background:#7a4800;color:#fff}
.btn-ghost{background:#f0f0f0;color:#444}

/* Form */
.lf{margin-bottom:14px}
.lf label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-bottom:5px}
.lf input,.lf select,.lf textarea{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:16px;outline:none}
.lf input:focus,.lf select:focus{border-color:#0d5c3a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Order items */
.order-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.order-item:last-child{border-bottom:none}
.oi-name{flex:1;font-size:13px;font-weight:600}
.oi-qty{display:flex;align-items:center;gap:6px}
.oi-qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid #ddd;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.oi-qty span{font-size:14px;font-weight:700;min-width:24px;text-align:center}

/* Picking */
.pick-scan-area{padding:16px;text-align:center}
.scan-result{font-size:15px;font-weight:600;color:#0d5c3a;margin:10px 0;min-height:24px}
.pistol-input{width:100%;padding:12px;border:2px solid #0d5c3a;border-radius:10px;font-size:16px;margin-bottom:10px}
.pick-hist{margin-top:16px}
.ph-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f9f9f9;border-radius:8px;margin-bottom:6px}
.ph-sku{font-size:12px;font-weight:600;color:#111;flex:1}
.ph-qty{font-size:12px;font-weight:700;color:#c0392b;margin:0 8px}
.ph-who{font-size:11px;color:#888}

/* Log */
.log-item{padding:12px;border-bottom:1px solid #f0f0f0}
.log-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.log-ts{font-size:11px;color:#888}
.log-who{font-size:12px;font-weight:600}
.lt{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.lt-pick{background:#e6f4ee;color:#0d5c3a}
.lt-order{background:#e8eff9;color:#1a3d72}
.lt-fulfill{background:#e6f4ee;color:#0d5c3a}
.lt-adjust{background:#fff3e0;color:#7a4800}
.lt-add{background:#f0e8f9;color:#4a1d72}
.log-body{font-size:12px;color:#444}

/* Overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.dialog{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.dialog h3{font-size:16px;font-weight:700;margin-bottom:16px}
.d-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* Toast */
.toast{position:fixed;bottom:70px;right:16px;background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .2s;z-index:999;pointer-events:none;max-width:300px}
.toast.on{opacity:1;transform:translateY(0)}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:#888;font-size:14px}

/* Mobile */
@media(max-width:500px){
  .topbar{padding:10px 12px}
  .content{padding:12px}
  .card-head{padding:12px 14px}
  .card-body{padding:12px 14px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Stok Display Manager</h1>
    <p>Masuk dengan akun kamu</p>
    <div class="field">
      <label>Username</label>
      <input id="loginName" type="text" placeholder="Username" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="Password" autocomplete="off">
    </div>
    <div id="loginErr" class="err"></div>
    <button class="btn-login" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- APP -->
<div id="appWrap" class="app">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Stok Display Manager</h1>
      <div class="sub" id="userInfo"></div>
    </div>
    <div class="topbar-right">
      <button class="tb-btn btn-white" onclick="backupData()">Backup</button>
      <button class="tb-btn btn-white" onclick="triggerRestore()">Pulihkan</button>
      <button class="tb-btn btn-white" onclick="doLogout()">Keluar</button>
    </div>
    <input type="file" id="restoreFile" accept=".json" hidden onchange="restoreData(event)">
  </div>
  <div class="tabs" id="tabBar"></div>
  <div class="content" id="mainContent"></div>
</div>

<!-- OVERLAYS -->
<div class="overlay" id="dlgAdjust">
  <div class="dialog">
    <h3>Adjust Stok</h3>
    <div id="dlgAdjustInfo" class="banner banner-ok" style="margin-bottom:14px"></div>
    <div class="lf"><label>Stok Baru</label><input type="number" id="dlgAdjustQty" min="0"></div>
    <div class="lf"><label>Catatan</label><input type="text" id="dlgAdjustNote" placeholder="Opsional"></div>
    <div class="d-acts">
      <button class="btn btn-ghost" onclick="closeOverlay('dlgAdjust')">Batal</button>
      <button class="btn btn-g" onclick="confirmAdjust()">Simpan</button>
    </div>
  </div>
</div>

<div class="overlay" id="dlgPickConfirm">
  <div class="dialog">
    <h3 id="pickConfirmTitle">Konfirmasi Picking</h3>
    <div id="pickConfirmInfo" class="banner banner-ok" style="margin-bottom:14px"></div>
    <div class="lf"><label>Jumlah diambil</label>
      <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
        <button class="btn btn-ghost" onclick="changePickQty(-1)" style="width:40px;height:40px;border-radius:50%;font-size:20px">-</button>
        <span id="pickQtyVal" style="font-size:24px;font-weight:700;min-width:40px;text-align:center">1</span>
        <button class="btn btn-ghost" onclick="changePickQty(1)" style="width:40px;height:40px;border-radius:50%;font-size:20px">+</button>
      </div>
    </div>
    <div class="d-acts">
      <button class="btn btn-ghost" onclick="closeOverlay('dlgPickConfirm')">Batal</button>
      <button class="btn btn-g" onclick="confirmPick()">Catat Picking</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = 'sdm_v1';
var SESSION = null;
var activeTab = 'stok';
var adjustTarget = null;
var pickTarget = null;
var pickQty = 1;
var logFilter = {role:'', type:'', sku:''};
var toastTimer;

var TABS = {
  Operasional: [{id:'stok',label:'Stok'},{id:'order',label:'Buat Order'},{id:'picking',label:'Picking'},{id:'log',label:'Histori'}],
  Inventory:   [{id:'stok',label:'Stok'},{id:'fulfill',label:'Penuhi Order'},{id:'picking',label:'Picking'},{id:'log',label:'Histori'}],
  Admin:       [{id:'stok',label:'Stok'},{id:'order',label:'Order'},{id:'fulfill',label:'Penuhi'},{id:'picking',label:'Picking'},{id:'manage',label:'Kelola SKU'},{id:'accounts',label:'Akun'},{id:'log',label:'Histori'}],
  Picking:     [{id:'picking',label:'Picking'},{id:'stok',label:'Stok'},{id:'log',label:'Histori'}]
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function ts(){ return new Date().toISOString(); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtTs(iso){ var d=new Date(iso); return d.toLocaleDateString('id-ID')+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }

function defaultData(){
  return {
    skus:[
      {id:'s1',name:'Sprayer_Hitam_500ml',unit:'pcs',stokReal:100,stokMin:20,kategori:'Sprayer'},
      {id:'s2',name:'Sprayer_Putih_500ml',unit:'pcs',stokReal:80,stokMin:20,kategori:'Sprayer'},
      {id:'s3',name:'Sprayer_Hijau_750ml',unit:'pcs',stokReal:60,stokMin:15,kategori:'Sprayer'},
      {id:'s4',name:'TutupBotol_Standar',unit:'pcs',stokReal:150,stokMin:30,kategori:'Sprayer'},
      {id:'s5',name:'Selang_Sprayer_30cm',unit:'pcs',stokReal:45,stokMin:25,kategori:'Sprayer'}
    ],
    katList:['Sprayer','Media Tanam','Perawatan Tanaman','Peralatan Berkebun','Pot & Dekorasi','Lainnya'],
    users:[
      {id:'u1',name:'Admin',role:'Admin',pass:'admin123',active:true}
    ],
    orders:[],
    log:[],
    orderSeq:0
  };
}

function load(){
  try{
    var r = localStorage.getItem(STORAGE_KEY);
    var d = r ? JSON.parse(r) : defaultData();
    if(!d.users) d.users = [{id:'u1',name:'Admin',role:'Admin',pass:'admin123',active:true}];
    if(!d.katList) d.katList = ['Sprayer','Media Tanam','Perawatan Tanaman','Peralatan Berkebun','Pot & Dekorasi','Lainnya'];
    return d;
  } catch(e){ return defaultData(); }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){}
  if(window.storage && typeof window.storage.set === 'function'){
    window.storage.set(STORAGE_KEY, JSON.stringify(DB), true).catch(function(){});
  }
}
function syncCloud(){
  if(!window.storage || typeof window.storage.get !== 'function') return;
  window.storage.get(STORAGE_KEY, true).then(function(r){
    if(!r || !r.value) return;
    try{
      var cloud = JSON.parse(r.value);
      if(cloud && cloud.log && cloud.log.length >= DB.log.length){
        DB = cloud;
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
        if(SESSION) renderPanel();
        showToast('Data tersinkron');
      }
    } catch(e){}
  }).catch(function(){});
}

var DB = load();

/* ---- AUTH ---- */
function doLogin(){
  var name = document.getElementById('loginName').value.trim();
  var pass = document.getElementById('loginPass').value;
  var err = document.getElementById('loginErr');
  if(!name||!pass){
    err.textContent = 'Username dan password wajib diisi';
    err.style.display = 'block'; return;
  }
  var user = null;
  for(var i=0;i<DB.users.length;i++){
    if(DB.users[i].name.toLowerCase()===name.toLowerCase() && DB.users[i].pass===pass && DB.users[i].active){
      user = DB.users[i]; break;
    }
  }
  if(!user){
    err.textContent = 'Username atau password salah';
    err.style.display = 'block'; return;
  }
  err.style.display = 'none';
  SESSION = {name:user.name, role:user.role, id:user.id};
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display = 'flex';
  document.getElementById('userInfo').textContent = user.name + ' - ' + user.role;
  activeTab = TABS[user.role][0].id;
  renderTabs();
  renderPanel();
  setTimeout(syncCloud, 1000);
  setInterval(syncCloud, 30000);
}
function doLogout(){
  SESSION = null;
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('loginPass').value = '';
}

/* ---- TABS ---- */
function renderTabs(){
  var bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  var tabs = TABS[SESSION.role] || [];
  for(var i=0;i<tabs.length;i++){
    var t = tabs[i];
    var div = document.createElement('div');
    div.className = 'tab' + (t.id===activeTab?' on':'');
    div.textContent = t.label;
    div.setAttribute('data-id', t.id);
    div.onclick = function(){ activeTab = this.getAttribute('data-id'); renderTabs(); renderPanel(); };
    bar.appendChild(div);
  }
}

/* ---- PANEL ---- */
function renderPanel(){
  var el = document.getElementById('mainContent');
  if(activeTab==='stok')     el.innerHTML = renderStok();
  else if(activeTab==='order')    el.innerHTML = renderOrder();
  else if(activeTab==='fulfill')  el.innerHTML = renderFulfill();
  else if(activeTab==='manage')   el.innerHTML = renderManage();
  else if(activeTab==='picking')  el.innerHTML = renderPicking();
  else if(activeTab==='log')      el.innerHTML = renderLog();
  else if(activeTab==='accounts') renderAccounts();
}

/* ---- STOK ---- */
var stokCat = 'Semua';
function renderStok(){
  var cats = ['Semua'].concat(DB.katList||[]);
  var list = stokCat==='Semua' ? DB.skus : DB.skus.filter(function(s){ return (s.kategori||'Lainnya')===stokCat; });
  var low = list.filter(function(s){ return s.stokReal<s.stokMin; }).length;
  var isAdmin = SESSION.role==='Admin';

  var catHtml = '';
  for(var i=0;i<cats.length;i++){
    var c = cats[i];
    var cnt = c==='Semua' ? DB.skus.length : DB.skus.filter(function(s){ return (s.kategori||'Lainnya')===c; }).length;
    catHtml += '<button class="cat-btn' + (stokCat===c?' on':'') + '" data-cat="' + esc(c) + '">' + esc(c) + ' (' + cnt + ')</button>';
  }

  var rows = '';
  for(var i=0;i<list.length;i++){
    var s = list[i];
    var lvl = s.stokReal===0 ? 'low' : s.stokReal<s.stokMin ? 'warn' : 'ok';
    var badge = lvl==='low' ? '<span class="badge badge-low">Habis</span>' : lvl==='warn' ? '<span class="badge badge-warn">Hampir habis</span>' : '<span class="badge badge-ok">Aman</span>';
    var editBtn = isAdmin ? '<button class="btn btn-sm btn-a" onclick="openAdjust(\'' + s.id + '\')">Edit</button>' : '';
    rows += '<tr><td><div style="font-weight:600;font-size:13px">' + esc(s.name) + '</div><div style="font-size:11px;color:#888">' + esc(s.kategori||'') + '</div></td><td style="font-weight:700;font-size:15px">' + s.stokReal + '</td><td>' + s.stokMin + '</td><td>' + badge + '</td><td>' + editBtn + '</td></tr>';
  }

  var bannerClass = low>0 ? 'banner-warn' : 'banner-ok';
  var bannerText = low>0 ? low + ' produk di bawah minimum display' : 'Semua produk aman';

  return '<div class="stats">'
    + '<div class="stat"><div class="n">' + DB.skus.length + '</div><div class="k">Total SKU</div></div>'
    + '<div class="stat ' + (low>0?'warn':'') + '"><div class="n">' + low + '</div><div class="k">Di bawah min</div></div>'
    + '<div class="stat"><div class="n">' + DB.orders.filter(function(o){return o.status==='Pending';}).length + '</div><div class="k">Order pending</div></div>'
    + '</div>'
    + '<div class="banner ' + bannerClass + '">' + bannerText + '</div>'
    + '<div class="card">'
    + '<div class="cat-bar" id="catBar">' + catHtml + '</div>'
    + '<div style="overflow-x:auto"><table class="tbl">'
    + '<thead><tr><th>Produk</th><th>Stok</th><th>Min</th><th>Status</th><th></th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div></div>';
}

document.addEventListener('click', function(e){
  var btn = e.target.closest('.cat-btn');
  if(btn){ stokCat = btn.getAttribute('data-cat'); renderPanel(); }
});

/* ---- ORDER ---- */
var orderItems = [];
function renderOrder(){
  var html = '<div class="card"><div class="card-head"><h2>Buat Permintaan</h2></div><div class="card-body">';
  html += '<div class="lf"><label>Cari SKU</label><input id="orderSearch" placeholder="Ketik nama produk..." oninput="searchOrder()" autocomplete="off"></div>';
  html += '<div id="orderResults" style="margin-bottom:14px"></div>';
  if(orderItems.length>0){
    html += '<div style="font-weight:700;font-size:13px;margin-bottom:10px">Item dipilih:</div>';
    for(var i=0;i<orderItems.length;i++){
      var it = orderItems[i];
      var sku = null; for(var j=0;j<DB.skus.length;j++) if(DB.skus[j].id===it.skuId){sku=DB.skus[j];break;}
      html += '<div class="order-item"><div class="oi-name">' + esc(sku?sku.name:it.skuId) + '</div>'
        + '<div class="oi-qty">'
        + '<button onclick="changeOrderQty(' + i + ',-1)">-</button>'
        + '<span>' + it.qty + '</span>'
        + '<button onclick="changeOrderQty(' + i + ',1)">+</button>'
        + '</div><button class="btn btn-sm btn-r" onclick="removeOrderItem(' + i + ')">Hapus</button></div>';
    }

function fulfillOrder(oid){
  var o=null; for(var i=0;i<DB.orders.length;i++) if(DB.orders[i].id===oid){o=DB.orders[i];break;}
  if(!o) return;
  for(var j=0;j<o.items.length;j++){
    var it=o.items[j];
    for(var k=0;k<DB.skus.length;k++){
      if(DB.skus[k].id===it.skuId){
        var before=DB.skus[k].stokReal;
        DB.skus[k].stokReal=Math.max(0,before-it.qty);
        DB.log.unshift({id:uid(),ts:ts(),type:'fulfill',who:SESSION.name,role:SESSION.role,orderId:oid,
          skuId:it.skuId,skuName:it.skuName,qty:it.qty,delta:-it.qty,stokBefore:before,stokAfter:DB.skus[k].stokReal});
        break;
      }
    }
  }
  o.status='Selesai'; o.fulfilledBy=SESSION.name; o.fulfilledTs=ts();
  save(); showToast('Order ' + oid + ' dipenuhi'); renderPanel();
}
function rejectOrder(oid){
  for(var i=0;i<DB.orders.length;i++) if(DB.orders[i].id===oid){DB.orders[i].status='Ditolak';break;}
  DB.log.unshift({id:uid(),ts:ts(),type:'fulfill',who:SESSION.name,role:SESSION.role,orderId:oid,note:'Order ditolak'});
  save(); showToast('Order ditolak'); renderPanel();
}

function triggerImport(){ document.getElementById('importFile').click(); }
function handleDrop(e){
  e.preventDefault(); document.getElementById('importDrop').style.borderColor='#ccc';
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f) processImportFile(f);
}
function handleImportFile(e){
  var f=e.target.files&&e.target.files[0];
  if(f) processImportFile(f);
  e.target.value='';
}
function processImportFile(file){
  var rawCat=file.name.replace(/\.[^.]+$/,'').replace(/^SKU[_\s-]*/i,'').replace(/_/g,' ').trim();
  var autoKat=rawCat.split(' ').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}).join(' ')||'Lainnya';
  var ext=file.name.split('.').pop().toLowerCase();
  var reader=new FileReader();
  if(ext==='xlsx'||ext==='xls'){
    if(typeof XLSX==='undefined'){showToast('Library Excel belum siap');return;}
    reader.onload=function(ev){
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',blankrows:false});
      importRows(rows,autoKat,file.name);
    };
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload=function(ev){
      var text=ev.target.result.replace(/^\uFEFF/,'');
      var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
      var rows=lines.map(function(l){
        var res=[],cur='',inq=false;
        for(var i=0;i<l.length;i++){if(l[i]==='"')inq=!inq;else if(l[i]===','&&!inq){res.push(cur.trim());cur='';}else cur+=l[i];}
        res.push(cur.trim()); return res;
      });
      importRows(rows,autoKat,file.name);
    };
    reader.readAsText(file,'UTF-8');
  }
}
function importRows(rows,autoKat,fname){
  if(!rows||rows.length<2){showToast('File kosong');return;}
  var h=rows[0].map(function(x){return String(x).toLowerCase();});
  function fc(kws){for(var i=0;i<h.length;i++)for(var j=0;j<kws.length;j++)if(h[i].indexOf(kws[j])>=0)return i;return -1;}
  var iN=fc(['nama','sku','name','produk']),iS=fc(['stok','stock','qty']),iM=fc(['min']),iU=fc(['satuan','unit']),iK=fc(['kategori','category']);
  if(iN<0){showToast('Kolom nama/SKU tidak ditemukan');return;}
  if(!DB.katList) DB.katList=['Sprayer','Media Tanam','Perawatan Tanaman','Peralatan Berkebun','Pot & Dekorasi','Lainnya'];
  var added=0,updated=0;
  for(var i=1;i<rows.length;i++){
    var r=rows[i]; if(!r||!r.length) continue;
    var name=String(r[iN]||'').trim().replace(/^"|"$/g,'');
    if(!name||name.charAt(0)==='#') continue;
    var kat=iK>=0&&r[iK]?String(r[iK]).trim()||autoKat:autoKat;
    if(DB.katList.indexOf(kat)<0) DB.katList.push(kat);
    var stok=iS>=0?parseInt(r[iS])||0:0;
    var min=iM>=0?parseInt(r[iM])||0:0;
    var unit=iU>=0&&r[iU]?String(r[iU]).trim()||'pcs':'pcs';
    var ex=null; for(var k=0;k<DB.skus.length;k++) if(DB.skus[k].name.toLowerCase()===name.toLowerCase()){ex=DB.skus[k];break;}
    if(ex){ex.stokReal=stok;ex.stokMin=min||ex.stokMin;ex.kategori=kat;updated++;}
    else{var nid=uid();DB.skus.push({id:nid,name:name,unit:unit,stokReal:stok,stokMin:min,kategori:kat});added++;}
  }
  save();showToast(added+' ditambahkan, '+updated+' diupdate - kategori: '+autoKat);renderPanel();
}
function exportSkuCsv(){
  var csv='Nama SKU,Stok Real,Min Display,Satuan,Kategori\n';
  for(var i=0;i<DB.skus.length;i++){
    var s=DB.skus[i];
    csv+='"'+(s.name||'').replace(/"/g,'""')+'",'+s.stokReal+','+s.stokMin+','+(s.unit||'pcs')+','+(s.kategori||'Lainnya')+'\n';
  }
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='SKU_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

    var tdN=document.createElement('td'); tdN.style.fontWeight='600'; tdN.textContent=u.name; tr.appendChild(tdN);
    var tdR=document.createElement('td');
    var badge=document.createElement('span'); badge.className='badge badge-role'; badge.style.background=rc[u.role]||'#555'; badge.textContent=u.role; tdR.appendChild(badge); tr.appendChild(tdR);
    var tdP=document.createElement('td'); tdP.style.cssText='font-family:monospace;color:#666'; tdP.textContent=u.pass; tr.appendChild(tdP);
    var tdS=document.createElement('td');
    var dot=document.createElement('span'); dot.style.color=u.active?'#0d5c3a':'#c0392b'; dot.textContent='* '; tdS.appendChild(dot);
    tdS.appendChild(document.createTextNode(u.active?'Aktif':'Nonaktif')); tr.appendChild(tdS);
    var tdA=document.createElement('td'); tdA.style.padding='8px 12px';
    if(u.id!=='u1'){
      var eb=document.createElement('button'); eb.className='btn btn-sm btn-a'; eb.style.marginRight='6px'; eb.textContent='Edit';
      (function(uid){eb.onclick=function(){openEditUser(uid);};})(u.id); tdA.appendChild(eb);
      var tb=document.createElement('button'); tb.className='btn btn-sm '+(u.active?'btn-r':'btn-ghost'); tb.textContent=u.active?'Nonaktifkan':'Aktifkan';
      (function(uid){tb.onclick=function(){toggleUserActive(uid);};})(u.id); tdA.appendChild(tb);
    }
    tr.appendChild(tdA); tbody.appendChild(tr);
  }
  table.appendChild(tbody); tableWrap.appendChild(table); card.appendChild(tableWrap); wrap.appendChild(card);
  el.innerHTML=''; el.appendChild(wrap);
}
function openAddUser(){
  closeOverlay('dlgAddUser');
  var d=document.createElement('div'); d.className='overlay on'; d.id='dlgAddUser';
  d.onclick=function(e){if(e.target===d)closeOverlay('dlgAddUser');};
  var box=document.createElement('div'); box.className='dialog';
  box.innerHTML='<h3>Tambah Akun Baru</h3>';
  var f1=mkField('Username','auName','text','contoh: Budi');
  var f2=mkField('Password','auPass','text','minimal 4 karakter');
  var rWrap=document.createElement('div'); rWrap.className='lf';
  var rLbl=document.createElement('label'); rLbl.textContent='Role';
  var rSel=document.createElement('select'); rSel.id='auRole'; rSel.style.cssText='width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:16px';
  ['Operasional','Inventory','Picking','Admin'].forEach(function(r){var o=document.createElement('option');o.value=r;o.textContent=r;rSel.appendChild(o);});
  rWrap.appendChild(rLbl); rWrap.appendChild(rSel);
  var acts=document.createElement('div'); acts.className='d-acts';
  var bc=document.createElement('button'); bc.className='btn btn-ghost'; bc.textContent='Batal'; bc.onclick=function(){closeOverlay('dlgAddUser');};
  var bs=document.createElement('button'); bs.className='btn btn-g'; bs.textContent='Simpan'; bs.onclick=confirmAddUser;
  acts.appendChild(bc); acts.appendChild(bs);
  box.appendChild(f1); box.appendChild(f2); box.appendChild(rWrap); box.appendChild(acts);
  d.appendChild(box); document.body.appendChild(d);
  setTimeout(function(){var el=document.getElementById('auName');if(el)el.focus();},100);
}
function mkField(labelText,inputId,inputType,placeholder){
  var w=document.createElement('div'); w.className='lf';
  var l=document.createElement('label'); l.textContent=labelText;
  var i=document.createElement('input'); i.type=inputType; i.id=inputId; i.placeholder=placeholder; i.autocomplete='off';
  w.appendChild(l); w.appendChild(i); return w;
}
function confirmAddUser(){
  var name=(document.getElementById('auName').value||'').trim();
  var pass=(document.getElementById('auPass').value||'').trim();
  var role=document.getElementById('auRole').value;
  if(!name){showToast('Username tidak boleh kosong');return;}
  if(pass.length<4){showToast('Password minimal 4 karakter');return;}
  for(var i=0;i<DB.users.length;i++) if(DB.users[i].name.toLowerCase()===name.toLowerCase()){showToast('Username sudah ada');return;}
  DB.users.push({id:uid(),name:name,role:role,pass:pass,active:true});
  save(); closeOverlay('dlgAddUser'); showToast('Akun '+name+' dibuat'); renderAccounts();
}
function openEditUser(userId){
  closeOverlay('dlgEditUser');
  var user=null; for(var i=0;i<DB.users.length;i++) if(DB.users[i].id===userId){user=DB.users[i];break;}
  if(!user) return;
  var d=document.createElement('div'); d.className='overlay on'; d.id='dlgEditUser';
  d.onclick=function(e){if(e.target===d)closeOverlay('dlgEditUser');};
  var box=document.createElement('div'); box.className='dialog';
  box.innerHTML='<h3>Edit: '+user.name+'</h3>';
  var f1=mkField('Password Baru','euPass','text','Kosongkan jika tidak diubah');
  document.body.appendChild(d); d.appendChild(box);
  setTimeout(function(){var el=document.getElementById('euPass');if(el)el.value=user.pass;},50);
  var rWrap=document.createElement('div'); rWrap.className='lf';
  var rLbl=document.createElement('label'); rLbl.textContent='Role';
  var rSel=document.createElement('select'); rSel.id='euRole'; rSel.style.cssText='width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:16px';
  ['Operasional','Inventory','Picking','Admin'].forEach(function(r){var o=document.createElement('option');o.value=r;o.textContent=r;if(r===user.role)o.selected=true;rSel.appendChild(o);});
  rWrap.appendChild(rLbl); rWrap.appendChild(rSel);
  var hidId=document.createElement('input'); hidId.type='hidden'; hidId.id='euId'; hidId.value=userId;
  var acts=document.createElement('div'); acts.className='d-acts';
  var bc=document.createElement('button'); bc.className='btn btn-ghost'; bc.textContent='Batal'; bc.onclick=function(){closeOverlay('dlgEditUser');};
  var bs=document.createElement('button'); bs.className='btn btn-g'; bs.textContent='Simpan'; bs.onclick=confirmEditUser;
  acts.appendChild(bc); acts.appendChild(bs);
  box.appendChild(f1); box.appendChild(rWrap); box.appendChild(hidId); box.appendChild(acts);
}
function confirmEditUser(){
  var userId=(document.getElementById('euId').value||'');
  var pass=(document.getElementById('euPass').value||'').trim();
  var role=document.getElementById('euRole').value;
  if(pass&&pass.length<4){showToast('Password minimal 4 karakter');return;}
  for(var i=0;i<DB.users.length;i++) if(DB.users[i].id===userId){if(pass)DB.users[i].pass=pass;DB.users[i].role=role;break;}
  save(); closeOverlay('dlgEditUser'); showToast('Akun diupdate'); renderAccounts();
}
function toggleUserActive(userId){
  for(var i=0;i<DB.users.length;i++) if(DB.users[i].id===userId){DB.users[i].active=!DB.users[i].active;showToast(DB.users[i].active?'Akun diaktifkan':'Akun dinonaktifkan');break;}
  save(); renderAccounts();
}

/* ---- LOG ---- */
function renderLog(){
  var tlabel={order:'Order',fulfill:'Dipenuhi',adjust:'Adjust',add:'Tambah SKU',pick:'Picking'};
  var tcls={order:'lt-order',fulfill:'lt-fulfill',adjust:'lt-adjust',add:'lt-add',pick:'lt-pick'};
  var logs=DB.log.filter(function(l){
    if(logFilter.role&&l.role!==logFilter.role) return false;
    if(logFilter.type&&l.type!==logFilter.type) return false;
    if(logFilter.sku&&!(l.skuName||'').toLowerCase().includes(logFilter.sku.toLowerCase())) return false;
    return true;
  });
  var today=new Date().toDateString();
  var todayPicks=DB.log.filter(function(l){return l.type==='pick'&&new Date(l.ts).toDateString()===today;});
  var totalPickQty=todayPicks.reduce(function(a,l){return a+(l.qty||0);},0);
  var pickSum={};
  for(var i=0;i<todayPicks.length;i++){var l=todayPicks[i];pickSum[l.skuName]=(pickSum[l.skuName]||0)+(l.qty||0);}
  var sumHtml='';
  var sk=Object.keys(pickSum);
  for(var i=0;i<sk.length;i++) sumHtml+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:13px"><span>'+esc(sk[i])+'</span><span style="font-weight:700;color:#c0392b">-'+pickSum[sk[i]]+' pcs</span></div>';
  var html='';
  if(totalPickQty>0) html+='<div class="card" style="margin-bottom:12px"><div class="card-head"><h2>Picking Hari Ini</h2><span style="font-weight:700;color:#c0392b">-'+totalPickQty+' pcs</span></div><div class="card-body">'+sumHtml+'</div></div>';
  html+='<div class="card"><div class="card-head" style="flex-wrap:wrap;gap:8px"><h2>Histori</h2><button class="btn btn-sm btn-ghost" onclick="exportLogCsv()">Export CSV</button></div>'
    +'<div style="padding:10px 18px;border-bottom:1px solid #f0f0f0;display:flex;gap:8px;flex-wrap:wrap">'
    +'<select style="font-size:13px;padding:6px 8px;border:1px solid #ddd;border-radius:6px" onchange="logFilter.role=this.value;renderPanel()"><option value="">Semua role</option><option>Operasional</option><option>Inventory</option><option>Admin</option><option>Picking</option></select>'
    +'<select style="font-size:13px;padding:6px 8px;border:1px solid #ddd;border-radius:6px" onchange="logFilter.type=this.value;renderPanel()"><option value="">Semua tipe</option><option value="order">Order</option><option value="fulfill">Dipenuhi</option><option value="adjust">Adjust</option><option value="pick">Picking</option></select>'
    +'<button class="btn btn-sm btn-ghost" onclick="logFilter={role:\'\',type:\'\',sku:\'\'};renderPanel()">Reset</button></div>'
    +'<div>'+(logs.length?logs.slice(0,100).map(function(l){
      var d=l.delta!=null?(l.delta>0?'<span style="color:#0d5c3a">+'+l.delta+'</span>':'<span style="color:#c0392b">'+l.delta+'</span>'):'';
      return '<div class="log-item"><div class="log-head"><span class="log-ts">'+fmtTs(l.ts)+'</span><span class="lt '+(tcls[l.type]||'lt-order')+'">'+(tlabel[l.type]||l.type)+'</span><span class="log-who">'+esc(l.who)+'</span></div>'
        +'<div class="log-body">'+esc(l.skuName||'')+(l.qty!=null?' x'+l.qty:'')+(d?' '+d:'')+(l.note?' - '+esc(l.note):'')+'</div></div>';
    }).join(''):'<div class="empty">Belum ada histori</div>')+'</div></div>';
  return html;
}
function exportLogCsv(){
  var logs=DB.log;
  var csv='Waktu,Tipe,Nama,Role,SKU,Qty,Delta,Catatan\n';
  for(var i=0;i<logs.length;i++){
    var l=logs[i];
    csv+=[fmtTs(l.ts),l.type,l.who,l.role,l.skuName||'',l.qty||'',l.delta||'',l.note||''].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',')+'\n';
  }
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='Log_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

/* ---- UTILS ---- */
function openOverlay(id){ var el=document.getElementById(id); if(el) el.classList.add('on'); }
function closeOverlay(id){ var el=document.getElementById(id); if(el){ el.classList.remove('on'); if(el.id!=='dlgAdjust'&&el.id!=='dlgPickConfirm') el.remove(); } }
function showToast(msg){
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.classList.remove('on');},2800);
}

/* ---- BACKUP & RESTORE ---- */
function backupData(){
  var json = JSON.stringify(DB, null, 2);
  var a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
  a.download = 'SDM_Backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('Backup didownload - kirim ke HP lain via WhatsApp/Drive');
}
function triggerRestore(){
  document.getElementById('restoreFile').click();
}
function restoreData(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = JSON.parse(ev.target.result);
      if(!data.skus || !data.users){showToast('File tidak valid');return;}
      DB = data;
      save();
      showToast('Data berhasil dipulihkan - ' + DB.users.length + ' akun, ' + DB.skus.length + ' SKU');
      if(SESSION) renderPanel();
    } catch(ex){ showToast('Gagal baca file: ' + ex.message); }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}
