<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Fulfill</title>
<style>
:root {
  --bg: #f0f4f2;
  --surface: #ffffff;
  --surface2: #fafafa;
  --border: #e8e8e8;
  --text: #111111;
  --text2: #555555;
  --text3: #888888;
  --accent: #0d5c3a;
  --accent-dark: #0d1a12;
  --accent-lt: #e6f4ee;
  --warn: #7a4800;
  --warn-lt: #fff3e0;
  --danger: #8b1a1a;
  --danger-lt: #fdecea;
  --info: #1a3d72;
  --info-lt: #e8eff9;
  --purple-lt: #f5e6f9;
  --purple: #4a1d72;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1710; --surface: #1a2b1e; --surface2: #152118; --border: #2a3d2e;
    --text: #eaf2ec; --text2: #a8bfac; --text3: #6b876f; --accent: #3caf74;
    --accent-dark: #0d1a12; --accent-lt: #142a1d; --warn: #c98a30; --warn-lt: #2a1e08;
    --danger: #d45f5f; --danger-lt: #2a1010; --info: #5480c0; --info-lt: #0e1d38;
    --purple-lt: #1e0d30; --purple: #c090f0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1710; --surface: #1a2b1e; --surface2: #152118; --border: #2a3d2e;
  --text: #eaf2ec; --text2: #a8bfac; --text3: #6b876f; --accent: #3caf74;
  --accent-dark: #0d1a12; --accent-lt: #142a1d; --warn: #c98a30; --warn-lt: #2a1e08;
  --danger: #d45f5f; --danger-lt: #2a1010; --info: #5480c0; --info-lt: #0e1d38;
  --purple-lt: #1e0d30; --purple: #c090f0; color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
input,select,button,textarea{font-family:inherit;font-size:16px;color:inherit}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface);border-radius:16px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.12);border:1px solid var(--border)}
.login-logo{width:52px;height:52px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.login-logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
.login-box h1{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.login-box p{font-size:13px;color:var(--text3);margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin-bottom:5px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;outline:none;background:var(--surface);color:var(--text)}
.field input:focus{border-color:var(--accent)}
.err{color:var(--danger);font-size:13px;margin-bottom:10px;display:none;padding:8px 12px;background:var(--danger-lt);border-radius:8px}
.btn-login{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.btn-login:active{opacity:.85}
.sync-indicator{font-size:11px;text-align:center;margin-top:12px;color:var(--text3)}
.app{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--accent-dark);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:8px;flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:700;color:#fff}
.topbar .sub{font-size:11px;color:rgba(255,255,255,.5)}
.topbar-right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb-btn{padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.btn-white{background:#fff;color:#111}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;display:inline-block;margin-right:4px}
.sync-dot.off{background:#f44336}
.tabs{display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-size:13px;font-weight:600;color:var(--text3);border-bottom:2.5px solid transparent;white-space:nowrap;cursor:pointer}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.content{padding:16px;flex:1;max-width:900px;margin:0 auto;width:100%}
.card{background:var(--surface);border-radius:12px;margin-bottom:14px;overflow:hidden;border:1px solid var(--border)}
.card-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.card-head h2{font-size:15px;font-weight:700;color:var(--text)}
.card-body{padding:14px 18px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}
.b-ok{background:var(--accent-lt);color:var(--accent)}
.b-warn{background:var(--warn-lt);color:var(--warn)}
.b-low{background:var(--danger-lt);color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:10px;padding:14px;border:1px solid var(--border);text-align:center}
.stat .n{font-size:22px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--text3);margin-top:2px}
.stat.red .n{color:var(--danger)}
.banner{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.bn-ok{background:var(--accent-lt);color:var(--accent)}
.bn-warn{background:var(--warn-lt);color:var(--warn)}
.cat-bar{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border);overflow-x:auto}
.cat-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap}
.cat-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer}
.btn:active{opacity:.8}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-g{background:var(--accent);color:#fff}
.btn-r{background:var(--danger);color:#fff}
.btn-a{background:var(--warn);color:#fff}
.btn-ghost{background:var(--border);color:var(--text2)}
.lf{margin-bottom:12px}
.lf label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin-bottom:5px}
.lf input,.lf select,.lf textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;outline:none;background:var(--surface);color:var(--text)}
.lf input:focus,.lf select:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.order-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.oi-name{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.oi-qty{display:flex;align-items:center;gap:6px}
.oi-qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer}
.oi-qty span{font-size:14px;font-weight:700;min-width:22px;text-align:center;color:var(--text);font-variant-numeric:tabular-nums}
.pistol-input{width:100%;padding:12px;border:2px solid var(--accent);border-radius:10px;font-size:16px;margin-bottom:8px;background:var(--surface);color:var(--text)}
.scan-result{font-size:14px;font-weight:600;min-height:22px;margin-bottom:10px;color:var(--accent)}
.ph-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--surface2);border-radius:8px;margin-bottom:5px}
.ph-sku{font-size:12px;font-weight:600;flex:1;color:var(--text)}
.ph-qty{font-size:12px;font-weight:700;color:var(--danger);margin:0 8px;font-variant-numeric:tabular-nums}
.ph-who{font-size:11px;color:var(--text3)}
.log-item{padding:10px 18px;border-bottom:1px solid var(--border)}
.log-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.log-ts{font-size:11px;color:var(--text3)}
.log-who{font-size:12px;font-weight:600;color:var(--text)}
.lt{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.lt-pick{background:var(--accent-lt);color:var(--accent)}
.lt-order{background:var(--info-lt);color:var(--info)}
.lt-fulfill{background:var(--accent-lt);color:var(--accent)}
.lt-adjust{background:var(--warn-lt);color:var(--warn)}
.lt-add{background:var(--purple-lt);color:var(--purple)}
.log-body{font-size:12px;color:var(--text2)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.dialog{background:var(--surface);border-radius:14px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;border:1px solid var(--border)}
.dialog h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)}
.d-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:70px;right:16px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .2s;z-index:999;pointer-events:none;max-width:300px}
.toast.on{opacity:1;transform:translateY(0)}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:500px){.row2{grid-template-columns:1fr}.content{padding:12px}.card-head{padding:12px 14px}.card-body{padding:12px 14px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Warehouse Fulfill</h1>
    <p>Masuk dengan akun kamu</p>
    <div class="field"><label>Username</label><input id="loginName" type="text" placeholder="Username" autocomplete="off"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Password" autocomplete="off"></div>
    <div id="loginErr" class="err"></div>
    <button class="btn-login" onclick="doLogin()">Masuk</button>
    <div class="sync-indicator" id="syncStatus">Menghubungkan ke server...</div>
  </div>
</div>

<!-- APP -->
<div id="appWrap" class="app">
  <div class="topbar">
    <div>
      <h1>Warehouse Fulfill</h1>
      <div class="sub" id="userInfo"></div>
    </div>
    <div class="topbar-right">
      <span id="onlineDot"><span class="sync-dot off"></span><span style="font-size:11px;color:#aaa">Offline</span></span>
      <button class="tb-btn btn-white" onclick="openChangePass()">Ubah Password</button>
      <button class="tb-btn btn-white" onclick="doLogout()">Keluar</button>
    </div>
  </div>
  <div class="tabs" id="tabBar"></div>
  <div class="content" id="mainContent"></div>
</div>

<!-- DIALOG: ADJUST STOK -->
<div class="overlay" id="dlgAdjust">
  <div class="dialog">
    <h3>Adjust Stok</h3>
    <div id="dlgAdjustInfo" class="banner bn-ok" style="margin-bottom:12px"></div>
    <div class="lf"><label>Stok Baru</label><input type="number" id="dlgAdjustQty" min="0"></div>
    <div class="lf"><label>Catatan</label><input type="text" id="dlgAdjustNote" placeholder="Opsional"></div>
    <div class="d-acts">
      <button class="btn btn-ghost" onclick="closeOverlay('dlgAdjust')">Batal</button>
      <button class="btn btn-g" onclick="confirmAdjust()">Simpan</button>
    </div>
  </div>
</div>

<!-- DIALOG: PICKING CONFIRM -->
<div class="overlay" id="dlgPickConfirm">
  <div class="dialog">
    <h3 id="pickTitle">Konfirmasi Picking</h3>
    <div id="pickInfo" class="banner bn-ok" style="margin-bottom:12px"></div>
    <div class="lf"><label>Jumlah diambil</label>
      <div style="display:flex;align-items:center;gap:14px;margin-top:6px">
        <button class="btn btn-ghost" onclick="chgPickQty(-1)" style="width:40px;height:40px;border-radius:50%;font-size:20px">-</button>
        <span id="pickQtyVal" style="font-size:26px;font-weight:700;min-width:36px;text-align:center;font-variant-numeric:tabular-nums">1</span>
        <button class="btn btn-ghost" onclick="chgPickQty(1)" style="width:40px;height:40px;border-radius:50%;font-size:20px">+</button>
      </div>
    </div>
    <div class="d-acts">
      <button class="btn btn-ghost" onclick="closeOverlay('dlgPickConfirm')">Batal</button>
      <button class="btn btn-g" onclick="confirmPick()">Catat Picking</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDUnqVev-Q4BoxLplQhRNynnvmM9877RJY",
  authDomain: "gudang-fulfill.firebaseapp.com",
  projectId: "gudang-fulfill",
  storageBucket: "gudang-fulfill.firebasestorage.app",
  messagingSenderId: "513200898711",
  appId: "1:513200898711:web:ddc6524106224caf96dfd2"
};

var app, db, DOC;
var SESSION = null;
var DB = null;
var activeTab = 'stok';
var adjustTarget = null;
var pickTarget = null;
var pickQty = 1;
var stokCat = 'Semua';
var orderItems = [];
var logFilter = {role:'',type:'',sku:''};
var toastTimer;
var unsubscribe = null;
var isOnline = false;

var TABS = {
  Operasional:[{id:'stok',label:'Stok'},{id:'order',label:'Buat Order'},{id:'picking',label:'Picking'},{id:'log',label:'Histori'}],
  Inventory:  [{id:'stok',label:'Stok'},{id:'fulfill',label:'Penuhi Order'},{id:'picking',label:'Picking'},{id:'log',label:'Histori'}],
  Admin:      [{id:'stok',label:'Stok'},{id:'order',label:'Order'},{id:'fulfill',label:'Penuhi'},{id:'picking',label:'Picking'},{id:'manage',label:'Kelola SKU'},{id:'accounts',label:'Akun'},{id:'log',label:'Histori'}],
  Picking:    [{id:'picking',label:'Picking'},{id:'stok',label:'Stok'},{id:'log',label:'Histori'}]
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function ts(){ return new Date().toISOString(); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtTs(iso){ var d=new Date(iso); return d.toLocaleDateString('id-ID')+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }

function defaultData(){
  return {
    skus:[
      {id:'s1',name:'Sprayer_Hitam_500ml',unit:'pcs',stokReal:100,stokMin:20,kategori:'Sprayer'},
      {id:'s2',name:'Sprayer_Putih_500ml',unit:'pcs',stokReal:80,stokMin:20,kategori:'Sprayer'},
      {id:'s3',name:'Sprayer_Hijau_750ml',unit:'pcs',stokReal:60,stokMin:15,kategori:'Sprayer'}
    ],
    katList:['Sprayer','Media Tanam','Perawatan Tanaman','Peralatan Berkebun','Pot & Dekorasi','Lainnya'],
    users:[{id:'u1',name:'Admin',role:'Admin',pass:'admin123',active:true}],
    orders:[],log:[],orderSeq:0
  };
}

function startSync(){
  unsubscribe = DOC.onSnapshot(function(doc){
    setOnline(true);
    if(doc.exists){
      var data = doc.data();
      if(data && (data.skus||data.users)){
        DB = data;
        if(!DB.users) DB.users=[{id:'u1',name:'Admin',role:'Admin',pass:'admin123',active:true}];
        if(!DB.katList) DB.katList=['Sprayer','Media Tanam','Perawatan Tanaman','Peralatan Berkebun','Pot & Dekorasi','Lainnya'];
        if(!DB.skus) DB.skus=[];
        if(!DB.orders) DB.orders=[];
        if(!DB.log) DB.log=[];
        try{
          localStorage.setItem('wf_users_bk', JSON.stringify(DB.users));
          localStorage.setItem('wf_log_bk', JSON.stringify(DB.log.slice(0,200)));
        }catch(e){}
      } else if(!DB) {
        try{ var r=localStorage.getItem('wf_v1'); DB=r?JSON.parse(r):defaultData(); }
        catch(e){ DB=defaultData(); }
      }
    } else {
      if(!DB){
        try{ var r=localStorage.getItem('wf_v1'); DB=r?JSON.parse(r):defaultData(); }
        catch(e){ DB=defaultData(); }
        saveToFirebase();
      }
    }
    var el=document.getElementById('syncStatus');
    if(el) el.textContent='Terhubung - data sinkron';
    if(SESSION) renderPanel();
  }, function(err){
    setOnline(false);
    var el=document.getElementById('syncStatus');
    if(el) el.textContent='Offline - coba refresh';
    if(!DB){
      try{
        var bkU=localStorage.getItem('wf_users_bk');
        var r=localStorage.getItem('wf_v1');
        DB=r?JSON.parse(r):defaultData();
        if(bkU && DB){ var pu=JSON.parse(bkU); if(pu&&pu.length>0) DB.users=pu; }
      }catch(e){ DB=defaultData(); }
    }
    if(SESSION) renderPanel();
  });
}

function saveToFirebase(){
  if(!DB) return;
  if(!DB.users||!DB.skus){ console.warn('saveToFirebase: data tidak valid'); return; }
  try{ localStorage.setItem('wf_v1', JSON.stringify(DB)); }catch(e){}
  DOC.set(DB, {merge: false}).catch(function(err){ showToast('Gagal simpan: '+err.message); });
}

function setOnline(val){
  isOnline = val;
  var el = document.getElementById('onlineDot');
  if(el) el.innerHTML = val
    ? '<span class="sync-dot"></span><span style="font-size:11px;color:#aaa">Online</span>'
    : '<span class="sync-dot off"></span><span style="font-size:11px;color:#aaa">Offline</span>';
}

function doLogin(){
  var name=(document.getElementById('loginName').value||'').trim();
  var pass=document.getElementById('loginPass').value||'';
  var err=document.getElementById('loginErr');
  if(!name||!pass){err.textContent='Username dan password wajib diisi';err.style.display='block';return;}
  if(!DB){err.textContent='Menghubungkan ke server, tunggu sebentar...';err.style.display='block';return;}
  var user=null;
  for(var i=0;i<DB.users.length;i++){
    if(DB.users[i].name.toLowerCase()===name.toLowerCase()&&DB.users[i].pass===pass&&DB.users[i].active){user=DB.users[i];break;}
  }
  if(!user){err.textContent='Username atau password salah';err.style.display='block';return;}
  err.style.display='none';
  SESSION={name:user.name,role:user.role,id:user.id};
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('appWrap').style.display='flex';
  document.getElementById('userInfo').textContent=user.name+' - '+user.role;
  activeTab=TABS[user.role][0].id;
  renderTabs(); renderPanel();
}
function doLogout(){
  SESSION=null;
  document.getElementById('appWrap').style.display='none';
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('loginPass').value='';
}

function renderTabs(){
  var bar=document.getElementById('tabBar'); bar.innerHTML='';
  var tabs=TABS[SESSION.role]||[];
  for(var i=0;i<tabs.length;i++){
    var t=tabs[i];
    var div=document.createElement('div');
    div.className='tab'+(t.id===activeTab?' on':'');
    div.textContent=t.label;
    div.setAttribute('data-id',t.id);
    div.onclick=function(){activeTab=this.getAttribute('data-id');renderTabs();renderPanel();};
    bar.appendChild(div);
  }
}

function renderPanel(){
  var el=document.getElementById('mainContent');
  if(activeTab==='stok')      el.innerHTML=renderStok();
  else if(activeTab==='order')    el.innerHTML=renderOrder();
  else if(activeTab==='fulfill')  el.innerHTML=renderFulfill();
  else if(activeTab==='manage')   el.innerHTML=renderManage();
  else if(activeTab==='picking')  el.innerHTML=renderPicking();
  else if(activeTab==='log')      el.innerHTML=renderLog();
  else if(activeTab==='accounts') renderAccounts();
}

function renderStok(){
  var cats=['Semua'].concat(DB.katList||[]);
  var list=stokCat==='Semua'?DB.skus:DB.skus.filter(function(s){return(s.kategori||'Lainnya')===stokCat;});
  var low=list.filter(function(s){return s.stokReal<s.stokMin;}).length;
  var isAdmin=SESSION.role==='Admin';
  var catHtml='';
  for(var i=0;i<cats.length;i++){
    var c=cats[i];
    var cnt=c==='Semua'?DB.skus.length:DB.skus.filter(function(x){return(x.kategori||'Lainnya')===c;}).length;
    catHtml+='<button class="cat-btn'+(stokCat===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+' ('+cnt+')</button>';
  }
  var rows='';
  for(var i=0;i<list.length;i++){
    var s=list[i];
    var lvl=s.stokReal===0?'low':s.stokReal<s.stokMin?'warn':'ok';
    var badge=lvl==='low'?'<span class="badge b-low">Habis</span>':lvl==='warn'?'<span class="badge b-warn">Hampir habis</span>':'<span class="badge b-ok">Aman</span>';
    var editBtn=isAdmin?'<button class="btn btn-sm btn-a" onclick="openAdjust(\''+s.id+'\')">Edit</button>':'';
    var stokColor=lvl==='ok'?'var(--accent)':lvl==='warn'?'var(--warn)':'var(--danger)';
    rows+='<tr><td><div style="font-weight:600;font-size:13px">'+esc(s.name)+'</div><div style="font-size:11px;color:var(--text3)">'+esc(s.kategori||'')+'</div></td>'
      +'<td style="font-weight:700;font-size:15px;color:'+stokColor+';font-variant-numeric:tabular-nums">'+s.stokReal+'</td>'
      +'<td style="font-variant-numeric:tabular-nums">'+s.stokMin+'</td>'
      +'<td>'+badge+'</td><td>'+editBtn+'</td></tr>';
  }
  return '<div class="stats">'
    +'<div class="stat"><div class="n">'+DB.skus.length+'</div><div class="k">Total SKU</div></div>'
    +'<div class="stat'+(low>0?' red':'')+'"><div class="n">'+low+'</div><div class="k">Di bawah min</div></div>'
    +'<div class="stat"><div class="n">'+DB.orders.filter(function(o){return o.status==='Pending';}).length+'</div><div class="k">Order pending</div></div></div>'
    +'<div class="banner '+(low>0?'bn-warn':'bn-ok')+'">'+( low>0?low+' produk di bawah minimum display':'Semua produk aman')+'</div>'
    +'<div class="card"><div class="cat-bar" id="catBar">'+catHtml+'</div>'
    +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Produk</th><th>Stok</th><th>Min</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderOrder(){

function searchOrder(){
  var q=(document.getElementById('orderSearch').value||'').toLowerCase().trim();
  var el=document.getElementById('orderResults');
  if(!q){el.innerHTML='';return;}
  var found=DB.skus.filter(function(s){return s.name.toLowerCase().includes(q);}).slice(0,6);
  if(!found.length){el.innerHTML='<div style="color:var(--text3);font-size:13px">Tidak ditemukan</div>';return;}
  var html='';
  for(var i=0;i<found.length;i++){
    var s=found[i];
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">'
      +'<div><div style="font-size:13px;font-weight:600;color:var(--text)">'+esc(s.name)+'</div><div style="font-size:11px;color:var(--text3)">Stok: '+s.stokReal+' | '+esc(s.kategori||'')+'</div></div>'
      +'<button class="btn btn-sm btn-g" onclick="addOrderItem(\''+s.id+'\')">Tambah</button></div>';
  }

}
function addOrderItem(skuId){
  for(var i=0;i<orderItems.length;i++) if(orderItems[i].skuId===skuId){orderItems[i].qty++;renderPanel();return;}
  orderItems.push({skuId:skuId,qty:1}); renderPanel();
}
function chgOrderQty(idx,d){ orderItems[idx].qty=Math.max(1,orderItems[idx].qty+d); renderPanel(); }
function rmOrderItem(idx){ orderItems.splice(idx,1); renderPanel(); }
function submitOrder(){
  if(!orderItems.length){showToast('Tambah item dulu');return;}
  DB.orderSeq=(DB.orderSeq||0)+1;
  var oid='ORD-'+String(DB.orderSeq).padStart(4,'0');
  var items=orderItems.map(function(it){var sku=findSku(it.skuId);return{skuId:it.skuId,skuName:sku?sku.name:it.skuId,qty:it.qty};});

  DB.orders.push({id:oid,status:'Pending',who:SESSION.name,role:SESSION.role,ts:ts(),items:items,note:note?note.value:''});
  DB.log.unshift({id:uid(),ts:ts(),type:'order',who:SESSION.name,role:SESSION.role,orderId:oid,skuName:items.map(function(i){return i.skuName;}).join(', '),qty:items.length,note:'Order dibuat'});
  saveToFirebase(); orderItems=[]; showToast('Order '+oid+' dikirim'); renderPanel();
}

function renderFulfill(){
  var pending=DB.orders.filter(function(o){return o.status==='Pending';});
  if(!pending.length) return '<div class="empty">Tidak ada order pending</div>';
  var html='';
  for(var i=0;i<pending.length;i++){

    for(var j=0;j<o.items.length;j++){

      itemsHtml+='<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)"><span style="color:var(--text)">'+esc(it.skuName)+'</span><span style="font-weight:700;color:var(--text)">x'+it.qty+' '+(sku?esc(sku.unit):'pcs')+'</span></div>';
    }

      +itemsHtml+(o.note?'<div style="font-size:12px;color:var(--text3);margin-top:6px">Catatan: '+esc(o.note)+'</div>':'')
      +'<div style="display:flex;gap:8px;margin-top:12px">'
      +'<button class="btn btn-g" onclick="fulfillOrder(\''+o.id+'\')">Penuhi</button>'
      +'<button class="btn btn-r" onclick="rejectOrder(\''+o.id+'\')">Tolak</button>'
      +'</div></div></div>';
  }
  return html;

function fulfillOrder(oid){
  var o=null; for(var i=0;i<DB.orders.length;i++) if(DB.orders[i].id===oid){o=DB.orders[i];break;}
  if(!o) return;
  var insufficient=[];
  for(var j=0;j<o.items.length;j++){
    var it=o.items[j]; var sku=findSku(it.skuId);
    if(!sku||sku.stokReal<=0) insufficient.push((sku?sku.name:it.skuName)+' (stok: '+(sku?sku.stokReal:0)+')');
    else if(sku.stokReal<it.qty) insufficient.push(sku.name+' (stok: '+sku.stokReal+', diminta: '+it.qty+')');
  }
  if(insufficient.length>0){ showToast('Stok tidak cukup: '+insufficient.join(', ')); return; }
  for(var j=0;j<o.items.length;j++){
    var it=o.items[j]; var sku=findSku(it.skuId);
    if(sku){var before=sku.stokReal;sku.stokReal=Math.max(0,before-it.qty);DB.log.unshift({id:uid(),ts:ts(),type:'fulfill',who:SESSION.name,role:SESSION.role,orderId:oid,skuId:it.skuId,skuName:it.skuName,qty:it.qty,delta:-it.qty,stokBefore:before,stokAfter:sku.stokReal});}
  }
  o.status='Selesai'; o.fulfilledBy=SESSION.name; o.fulfilledTs=ts();
  saveToFirebase(); showToast('Order '+oid+' dipenuhi'); renderPanel();
}
function rejectOrder(oid){
  for(var i=0;i<DB.orders.length;i++) if(DB.orders[i].id===oid){DB.orders[i].status='Ditolak';break;}
  DB.log.unshift({id:uid(),ts:ts(),type:'fulfill',who:SESSION.name,role:SESSION.role,orderId:oid,note:'Order ditolak'});
  saveToFirebase(); showToast('Order ditolak'); renderPanel();
}

function renderPicking(){

    +'<input class="pistol-input" id="pistolInput" type="text" placeholder="Scan atau ketik SKU..." autocomplete="off" onkeydown="if(event.key===\'Enter\')handleScan()">'
    +'<div id="scanResult" class="scan-result"></div>'

    +(totalQty>0?'<div class="card"><div class="card-head"><h2>Picking Hari Ini</h2><span style="font-weight:700;color:var(--danger);font-variant-numeric:tabular-nums">-'+totalQty+' pcs</span></div><div class="card-body">'+sumHtml+'</div></div>':'')
    +(recent.length>0?'<div class="card"><div class="card-head"><h2>Log Terbaru</h2></div><div class="card-body">'+recentHtml+'</div></div>':'');

function handleScan(){
  var val=(document.getElementById('pistolInput').value||'').trim(); if(!val) return;
  var q=val.toLowerCase(); var sku=null;
  for(var i=0;i<DB.skus.length;i++) if(DB.skus[i].name.toLowerCase()===q||DB.skus[i].name===val){sku=DB.skus[i];break;}
  if(!sku) for(var i=0;i<DB.skus.length;i++) if(DB.skus[i].name.toLowerCase().includes(q)){sku=DB.skus[i];break;}
  var res=document.getElementById('scanResult');
  if(!sku){if(res)res.textContent='SKU tidak ditemukan: '+val;return;}
  if(res) res.textContent='Ditemukan: '+sku.name+' | Stok: '+sku.stokReal+' '+sku.unit;
  document.getElementById('pistolInput').value='';
  openPickConfirm(sku.id);
}

function openAddKat(){
  var name=prompt('Nama kategori baru:');
  if(!name||!name.trim()) return;
  name=name.trim();
  if(DB.katList.indexOf(name)>=0){showToast('Kategori sudah ada');return;}
  DB.katList.push(name);
  saveToFirebase(); showToast('Kategori "'+name+'" ditambahkan'); renderPanel();
}
function delKat(kat){
  var used=DB.skus.filter(function(s){return s.kategori===kat;}).length;
  if(used>0){showToast(kat+' masih dipakai oleh '+used+' SKU');return;}
  DB.katList=DB.katList.filter(function(k){return k!==kat;});
  saveToFirebase(); showToast('Kategori dihapus'); renderPanel();
}
function toggleAllChk(cb){
  var chks=document.querySelectorAll('.sku-chk');
  for(var i=0;i<chks.length;i++) chks[i].checked=cb.checked;
  updateBulkBtn();
}
function updateBulkBtn(){
  var checked=document.querySelectorAll('.sku-chk:checked').length;
  var btn=document.getElementById('bulkDelBtn');
  if(btn) btn.style.display=checked>0?'inline-block':'none';
  if(btn && checked>0) btn.textContent='Hapus '+checked+' SKU';
}
function bulkDelSku(){
  var checked=document.querySelectorAll('.sku-chk:checked');
  if(!checked.length) return;
  if(!confirm('Hapus '+checked.length+' SKU yang dipilih?')) return;
  var ids=[];
  for(var i=0;i<checked.length;i++) ids.push(checked[i].getAttribute('data-id'));
  DB.skus=DB.skus.filter(function(s){return ids.indexOf(s.id)<0;});
  saveToFirebase(); showToast(ids.length+' SKU dihapus'); renderPanel();
}
function setSkuName(id,v){var v2=(v||'').trim();if(!v2){showToast('Nama tidak boleh kosong');return;}var s=findSku(id);if(s){s.name=v2;saveToFirebase();showToast('Nama SKU diupdate');}}
function setSkuKat(id,v){var s=findSku(id);if(s){s.kategori=v;saveToFirebase();}}
function setSkuStok(id,v){var s=findSku(id);if(s){var b=s.stokReal;s.stokReal=parseInt(v)||0;DB.log.unshift({id:uid(),ts:ts(),type:'adjust',who:SESSION.name,role:SESSION.role,skuId:id,skuName:s.name,qty:s.stokReal,delta:s.stokReal-b,stokBefore:b,stokAfter:s.stokReal,note:'Edit manual'});saveToFirebase();showToast('Stok diupdate');}}
function setSkuMin(id,v){var s=findSku(id);if(s){s.stokMin=parseInt(v)||0;saveToFirebase();}}
function delSku(id){if(!confirm('Hapus SKU ini?')) return;DB.skus=DB.skus.filter(function(s){return s.id!==id;});saveToFirebase();renderPanel();}

function confirmAddSku(){

function handleDrop(e){e.preventDefault();document.getElementById('importDrop').style.borderColor='var(--border)';var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)processImportFile(f);}
function handleImportFile(e){var f=e.target.files&&e.target.files[0];if(f)processImportFile(f);e.target.value='';}
function processImportFile(file){
  var rawCat=file.name.replace(/\.[^.]+$/,'').replace(/^SKU[_\s-]*/i,'').replace(/_/g,' ').trim();
  var autoKat=rawCat.split(' ').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}).join(' ')||'Lainnya';
  var ext=file.name.split('.').pop().toLowerCase(); var reader=new FileReader();
  if(ext==='xlsx'||ext==='xls'){
    if(typeof XLSX==='undefined'){showToast('Library Excel belum siap, coba lagi');return;}
    reader.onload=function(ev){try{var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',blankrows:false}),autoKat);}catch(e){showToast('Error baca Excel: '+e.message);}};
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload=function(ev){
      var text=ev.target.result.replace(/^﻿/,'');
      var rows=text.split(/\r?\n/).filter(function(l){return l.trim();}).map(function(l){var r=[],c='',iq=false;for(var i=0;i<l.length;i++){if(l[i]==='"')iq=!iq;else if(l[i]===','&&!iq){r.push(c.trim());c='';}else c+=l[i];}r.push(c.trim());return r;});
      importRows(rows,autoKat);
    };
    reader.readAsText(file,'UTF-8');
  }
}
function importRows(rows,autoKat){
  if(!rows||rows.length<2){showToast('File kosong');return;}
  var h=rows[0].map(function(x){return String(x).toLowerCase();});
  function fc(kws){for(var i=0;i<h.length;i++)for(var j=0;j<kws.length;j++)if(h[i].indexOf(kws[j])>=0)return i;return -1;}
  var iN=fc(['nama','sku','name']),iS=fc(['stok','stock','qty']),iM=fc(['min']),iU=fc(['satuan','unit']),iK=fc(['kategori','cat']);
  if(iN<0){showToast('Kolom nama/SKU tidak ditemukan');return;}
  if(!DB.katList)DB.katList=['Sprayer','Lainnya'];
  var added=0,updated=0;
  for(var i=1;i<rows.length;i++){
    var r=rows[i]; if(!r||!r.length) continue;
    var name=String(r[iN]||'').trim().replace(/^"|"$/g,'');
    if(!name||name.charAt(0)==='#') continue;
    var kat=iK>=0&&r[iK]?String(r[iK]).trim()||autoKat:autoKat;
    if(DB.katList.indexOf(kat)<0)DB.katList.push(kat);
    var stok=iS>=0?parseInt(r[iS])||0:0, min=iM>=0?parseInt(r[iM])||0:0;
    var unit=iU>=0&&r[iU]?String(r[iU]).trim()||'pcs':'pcs';
    var ex=null; for(var k=0;k<DB.skus.length;k++) if(DB.skus[k].name.toLowerCase()===name.toLowerCase()){ex=DB.skus[k];break;}
    if(ex){ex.stokReal=stok;ex.stokMin=min||ex.stokMin;ex.kategori=kat;updated++;}
    else{DB.skus.push({id:uid(),name:name,unit:unit,stokReal:stok,stokMin:min,kategori:kat});added++;}
  }
  saveToFirebase(); showToast(added+' ditambahkan, '+updated+' diupdate'); renderPanel();
}

function renderLog(){
  var tlabel={order:'Order',fulfill:'Dipenuhi',adjust:'Adjust',add:'Tambah SKU',pick:'Picking'};
  var tcls={order:'lt-order',fulfill:'lt-fulfill',adjust:'lt-adjust',add:'lt-add',pick:'lt-pick'};
  var logs=DB.log.filter(function(l){
    if(logFilter.role&&l.role!==logFilter.role)return false;
    if(logFilter.type&&l.type!==logFilter.type)return false;
    if(logFilter.sku&&!(l.skuName||'').toLowerCase().includes(logFilter.sku.toLowerCase()))return false;
    return true;
  });
  var today=new Date().toDateString();
  var tp=DB.log.filter(function(l){return l.type==='pick'&&new Date(l.ts).toDateString()===today;});
  var tq=tp.reduce(function(a,l){return a+(l.qty||0);},0);
  var ps={}; for(var i=0;i<tp.length;i++){var l=tp[i];ps[l.skuName]=(ps[l.skuName]||0)+(l.qty||0);}
  var sh=''; var sk=Object.keys(ps);
  for(var i=0;i<sk.length;i++) sh+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text)">'+esc(sk[i])+'</span><span style="font-weight:700;color:var(--danger);font-variant-numeric:tabular-nums">-'+ps[sk[i]]+' pcs</span></div>';
  var html='';
  if(tq>0) html+='<div class="card" style="margin-bottom:12px"><div class="card-head"><h2>Picking Hari Ini</h2><span style="font-weight:700;color:var(--danger);font-variant-numeric:tabular-nums">-'+tq+' pcs</span></div><div class="card-body">'+sh+'<button class="btn btn-sm btn-ghost" onclick="exportLogCsv()" style="margin-top:10px">Export CSV</button></div></div>';
  html+='<div class="card"><div class="card-head" style="flex-wrap:wrap;gap:8px"><h2>Histori</h2><button class="btn btn-sm btn-ghost" onclick="exportLogCsv()">Export CSV</button></div>'
    +'<div style="padding:8px 18px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap">'
    +'<select style="font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)" onchange="logFilter.role=this.value;renderPanel()"><option value="">Semua role</option><option>Operasional</option><option>Inventory</option><option>Admin</option><option>Picking</option></select>'
    +'<select style="font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)" onchange="logFilter.type=this.value;renderPanel()"><option value="">Semua tipe</option><option value="order">Order</option><option value="fulfill">Dipenuhi</option><option value="adjust">Adjust</option><option value="pick">Picking</option></select>'
    +'<button class="btn btn-sm btn-ghost" onclick="logFilter={role:\'\',type:\'\',sku:\'\'};renderPanel()">Reset</button></div>'
    +'<div>'+(logs.length?logs.slice(0,80).map(function(l){
      var d=l.delta!=null?(l.delta>0?'<span style="color:var(--accent);font-variant-numeric:tabular-nums">+'+l.delta+'</span>':'<span style="color:var(--danger);font-variant-numeric:tabular-nums">'+l.delta+'</span>'):'';
      return '<div class="log-item"><div class="log-head"><span class="log-ts">'+fmtTs(l.ts)+'</span><span class="lt '+(tcls[l.type]||'lt-order')+'">'+(tlabel[l.type]||l.type)+'</span><span class="log-who">'+esc(l.who)+'</span></div>'
        +'<div class="log-body">'+esc(l.skuName||'')+(l.qty?' x'+l.qty:'')+(d?' '+d:'')+(l.note?' - '+esc(l.note):'')+'</div></div>';
    }).join(''):'<div class="empty">Belum ada histori</div>')+'</div></div>';
  return html;
}
